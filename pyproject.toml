[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccema"
version = "0.1.0"
description = "Counterfactual Conversation Emulation for Medical AI Agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oliver Liu" }]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/Oliver-Liu99/Counterfactual-Conversation-Emulation-for-Medical-AI-Agents"
"Bug Tracker" = "https://github.com/Oliver-Liu99/Counterfactual-Conversation-Emulation-for-Medical-AI-Agents/issues"
Repository = "https://github.com/Oliver-Liu99/Counterfactual-Conversation-Emulation-for-Medical-AI-Agents"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
